[project]
name = "neuralcut"
version = "0.5.0"
description = "NeuralCut — local-first AI video editor for Windows. Phase 2: editing core (timeline, undo/redo, FFmpeg export; no AI execution)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "NeuralCut contributors" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["neuralcut*"]

[tool.pytest.ini_options]
testpaths = ["neuralcut/tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that spin up the live HTTP server",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
