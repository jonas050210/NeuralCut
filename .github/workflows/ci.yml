name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node.js (frontend syntax check only)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg (media import/render tests)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          elif [ "$RUNNER_OS" = "Windows" ]; then
            # Fast static ffmpeg binary via pip; the media adapter and test
            # helpers resolve it through the imageio-ffmpeg fallback (this
            # also exercises the no-ffprobe probing path on Windows).
            python -m pip install imageio-ffmpeg
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests (core, projects, jobs, API)
        run: python -m pytest -q neuralcut/tests/test_config_logging.py neuralcut/tests/test_projects.py neuralcut/tests/test_jobs.py neuralcut/tests/test_api.py neuralcut/tests/test_main.py neuralcut/tests/test_integration_adapters.py

      - name: Run tests (editing and rendering)
        run: python -m pytest -q neuralcut/tests/test_editing.py neuralcut/tests/test_rendering.py

      - name: Run tests (intelligence)
        run: python -m pytest -q neuralcut/tests/test_intelligence.py

      - name: Run tests (effects logic)
        run: python -m pytest -q neuralcut/tests/test_effects.py -k "keyframe_evaluation or validation or crud or migrates or via_api"

      - name: Run tests (effects render - color)
        run: python -m pytest -q neuralcut/tests/test_effects.py -k "color_effect"

      - name: Run tests (effects render - glow/bloom)
        run: python -m pytest -q neuralcut/tests/test_effects.py -k "glow_and_bloom"

      - name: Diagnose glow/bloom failure (Linux only)
        if: failure() && runner.os == 'Linux'
        run: |
          python -m pytest -q neuralcut/tests/test_effects.py -k "glow_and_bloom" -x --tb=short > /tmp/diag.txt 2>&1 || true
          python3 - <<'PYEOF' >> /tmp/diag.txt 2>&1
          import subprocess, tempfile
          from pathlib import Path
          import os
          os.environ["NEURALCUT_LOGGING__STDOUT"] = "false"
          from neuralcut.config import load_settings
          from neuralcut.backend.di import Container
          from neuralcut.backend.projects.model import ExportSettings
          tmp = Path(tempfile.mkdtemp())
          c = Container(load_settings(data_dir=tmp / "data"))
          c.project_service.create("D", tmp / "proj")
          src = tmp / "spot.mp4"
          ff = c.media.ffmpeg_path
          subprocess.run([ff, "-y", "-v", "error", "-f", "lavfi", "-i",
                          "color=c=black:s=320x240:r=10:d=2", "-vf",
                          "drawbox=x=140:y=100:w=40:h=40:color=white:t=fill",
                          "-c:v", "libx264", "-pix_fmt", "yuv420p", str(src)], check=True)
          asset = c.timeline_service.import_media(src)
          clip = c.timeline_service.add_clip(asset.id)
          c.timeline_service.add_effect(clip.id, type="glow", params={"strength": 0.9, "radius": 25.0})
          out = tmp / "glow-out.mp4"
          try:
              print("render result:", c.render_engine.render(
                  c.project_service.get(), out, ExportSettings(width=320, height=240, fps=10),
                  work_dir=tmp / "work"))
          except Exception as exc:
              print("render error:", exc)
          probe = c.media.ffprobe_path or "ffprobe"
          print(subprocess.run([probe, "-v", "error", "-show_entries",
                                "stream=codec_type,duration,start_time,time_base",
                                "-of", "default=nw=1", str(out)],
                               capture_output=True, text=True).stdout)
          print(subprocess.run([ff, "-hide_banner", "-i", str(out)],
                               capture_output=True, text=True).stderr[-800:])
          PYEOF
          python3 - <<'PYEOF'
          text = open("/tmp/diag.txt", encoding="utf-8", errors="replace").read()[-6000:]
          encoded = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error::GLOWDIAG {encoded}")
          PYEOF

      - name: Run tests (effects render - compositing)
        run: python -m pytest -q neuralcut/tests/test_effects.py -k "compositing"

      - name: Check frontend JavaScript syntax
        run: node --check neuralcut/frontend/assets/app.js
