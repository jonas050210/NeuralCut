name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node.js (frontend syntax check only)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg (media import/render tests)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          elif [ "$RUNNER_OS" = "Windows" ]; then
            # Fast static ffmpeg binary via pip; the media adapter and test
            # helpers resolve it through the imageio-ffmpeg fallback (this
            # also exercises the no-ffprobe probing path on Windows).
            python -m pip install imageio-ffmpeg
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests (core, projects, jobs, API)
        run: python -m pytest -q neuralcut/tests/test_config_logging.py neuralcut/tests/test_projects.py neuralcut/tests/test_jobs.py neuralcut/tests/test_api.py neuralcut/tests/test_main.py neuralcut/tests/test_integration_adapters.py

      - name: Run tests (editing and rendering)
        run: python -m pytest -q neuralcut/tests/test_editing.py neuralcut/tests/test_rendering.py

      - name: Run tests (intelligence)
        run: python -m pytest -q neuralcut/tests/test_intelligence.py

      - name: Run tests (effects)
        run: python -m pytest -q neuralcut/tests/test_effects.py

      - name: Check frontend JavaScript syntax
        run: node --check neuralcut/frontend/assets/app.js
