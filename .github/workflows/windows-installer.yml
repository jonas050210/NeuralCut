name: Windows Installer

# Builds the real NSIS setup.exe on a Windows runner: PyInstaller backend
# sidecar -> Tauri bundle -> uploaded as a build artifact. Manual trigger
# (packaging is heavy); artifacts are NOT GitHub Releases.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src-tauri/**"
      - "scripts/build_backend.ps1"
      - ".github/workflows/windows-installer.yml"

jobs:
  installer:
    name: Build setup.exe (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Build backend sidecar (PyInstaller)
        shell: pwsh
        run: |
          try {
            .\scripts\build_backend.ps1 *>&1 | Tee-Object -FilePath sidecar.log
            if ($LASTEXITCODE -ne 0) { throw "build_backend.ps1 exit $LASTEXITCODE" }
          } catch {
            $tail = (Get-Content sidecar.log -Tail 60 -ErrorAction SilentlyContinue) -join "`n"
            $esc = $tail -replace "%","%25" -replace "`r","" -replace "`n","%0A"
            Write-Host "::error::SIDECARDIAG $esc"
            throw
          }

      - name: Smoke-test the sidecar
        shell: pwsh
        run: |
          $exe = "src-tauri\binaries\neuralcut-backend-x86_64-pc-windows-msvc.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--no-browser","--port","8899" -PassThru
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 1
              try {
                $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8899/api/v1/health" -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "sidecar did not become healthy on /api/v1/health" }
            Write-Host "sidecar health OK"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Install Tauri CLI and build installer
        shell: pwsh
        run: |
          npm install
          npx tauri build

      - name: Silent install / launch / uninstall smoke test
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          Write-Host "Installing $($setup.Name) silently..."
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $installDir = Join-Path $env:LOCALAPPDATA "NeuralCut"
          $appExe = Join-Path $installDir "neuralcut.exe"
          if (-not (Test-Path $appExe)) { throw "installed neuralcut.exe not found in $installDir" }
          if (-not (Test-Path (Join-Path $installDir "neuralcut-backend.exe"))) { throw "backend sidecar missing from install" }
          $shortcut = Join-Path $env:USERPROFILE "Desktop\NeuralCut.lnk"
          if (Test-Path $shortcut) { Write-Host "desktop shortcut OK" } else { Write-Host "::warning::desktop shortcut not found" }
          Write-Host "Launching installed app..."
          $app = Start-Process -FilePath $appExe -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "installed app exited prematurely (code $($app.ExitCode))" }
          Write-Host "installed app stayed running; closing it"
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Get-Process neuralcut-backend -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Write-Host "Uninstalling silently..."
          Start-Process -FilePath (Join-Path $installDir "uninstall.exe") -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $appExe) { throw "uninstall left neuralcut.exe behind" }
          Write-Host "install/launch/uninstall smoke OK"

      - name: Upload setup.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuralCut-setup-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
