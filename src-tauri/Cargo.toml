[package]
name = "neuralcut"
version = "0.7.0"
description = "NeuralCut desktop shell (Phase 1 foundation; packaged backend is Phase 7)"
authors = ["NeuralCut contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
